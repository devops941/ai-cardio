# MongoDB 7 single-node replica set (Section 3).
# Prisma's MongoDB connector requires a replica set for transactions.
services:
  mongodb:
    image: mongo:7
    container_name: cardiocare-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  mongo_data:
